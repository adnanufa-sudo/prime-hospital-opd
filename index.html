}.shortcut{padding:14px;background:#fff;border:1px solid #dce4e4;border-radius:8px;text-align:left}.shortcut b{display:block;margin-bottom:5px}.toast{position:fixed;right:18px;bottom:18px;background:#17202a;color:#fff;padding:11px 15px;border-radius:8px;z-index:30}

const CONFIG={url:'https://xcvjyohvrfakhxoevlff.supabase.co',key:'sb_publishable_m7rsHfm0OpEtSrQui8HAiA_59l_S3UV'},STORE='prime-hospital-opd-v3';let db,session=null,view='home',editingPatient=null,editingVisit=null,saving=false;const D={patients:[],visits:[],medicines:[],templates:[]};const $=s=>document.querySelector(s),today=()=>new Date().toISOString().slice(0,10),id=()=>crypto.randomUUID(),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function clinical(v){return String(v??'').toUpperCase()}
function load(){try{Object.assign(D,JSON.parse(localStorage.getItem(STORE))||{})}catch{}['patients','visits','medicines','templates'].forEach(k=>{if(!Array.isArray(D[k]))D[k]=[]})}function saveLocal(){localStorage.setItem(STORE,JSON.stringify(D))}function uhid(){let n=D.patients.reduce((m,p)=>Math.max(m,parseInt(String(p.uhid||'').replace(/\D/g,''))||0),0);return 'PH-'+String(n+1).padStart(6,'0')}
async function sync(){if(!session||!navigator.onLine)return;try{const uid=session.user.id;for(const p of D.patients.filter(x=>x.syncStatus!=='synced')){const {error}=await db.from('patients').upsert({id:p.id,user_id:uid,uhid:p.uhid,first_name:p.firstName,age:p.age||null,sex:p.sex||null,mobile:p.mobile||null,created_at:p.createdAt||new Date().toISOString(),updated_at:p.updatedAt||new Date().toISOString()});if(error)throw error;p.syncStatus='synced'}for(const v of D.visits.filter(x=>x.syncStatus!=='synced')){const {error}=await db.from('visits').upsert({id:v.id,user_id:uid,patient_id:v.patientId,visit_date:v.date,clinical:{firstName:v.firstName,uhid:v.uhid,age:v.age,sex:v.sex,mobile:v.mobile,weight:v.weight,bp:v.bp,pulse:v.pulse,spo2:v.spo2,rr:v.rr,temp:v.temp,sugar:v.sugar,complaints:v.complaints,knownCase:v.knownCase,habits:v.habits,history:v.history,examination:v.examination,pd:v.pd,investigation:v.investigation,advice:v.advice,management:v.management},medicines:v.medicines||[],created_at:v.createdAt||new Date().toISOString(),updated_at:v.updatedAt||new Date().toISOString()});if(error)throw error;v.syncStatus='synced'}for(const x of D.medicines.filter(x=>x.syncStatus!=='synced')){const {error}=await db.from('medicines').upsert({id:x.id,user_id:uid,name:x.name,data:x.data||{},created_at:x.createdAt,updated_at:x.updatedAt});if(error)throw error;x.syncStatus='synced'}for(const x of D.templates.filter(x=>x.syncStatus!=='synced')){const {error}=await db.from('templates').upsert({id:x.id,user_id:uid,name:x.name,data:x.data||{},created_at:x.createdAt,updated_at:x.updatedAt});if(error)throw error;x.syncStatus='synced'}saveLocal();const [ps,vs,ms,ts]=await Promise.all([db.from('patients').select('*'),db.from('visits').select('*'),db.from('medicines').select('*'),db.from('templates').select('*')]);if(ps.error||vs.error||ms.error||ts.error)throw(ps.error||vs.error||ms.error||ts.error);const cloudP=ps.data||[],cloudV=vs.data||[];for(const p of cloudP){const old=D.patients.find(x=>x.id===p.id);if(!old||old.syncStatus==='synced')Object.assign(p,{firstName:p.first_name,createdAt:p.created_at,updatedAt:p.updated_at,syncStatus:'synced'}),D.patients[D.patients.findIndex(x=>x.id===p.id)]=p}for(const v of cloudV){const c=v.clinical||{};const nv={id:v.id,patientId:v.patient_id,date:v.visit_date,...c,medicines:v.medicines||[],createdAt:v.created_at,updatedAt:v.updated_at,syncStatus:'synced'};const i=D.visits.findIndex(x=>x.id===v.id);if(i<0)D.visits.push(nv);else if(D.visits[i].syncStatus==='synced')D.visits[i]=nv}for(const x of ms.data||[]){const n={id:x.id,name:x.name,data:x.data||{},createdAt:x.created_at,updatedAt:x.updated_at,syncStatus:'synced'},i=D.medicines.findIndex(y=>y.id===x.id);if(i<0)D.medicines.push(n);else if(D.medicines[i].syncStatus==='synced')D.medicines[i]=n}for(const x of ts.data||[]){const n={id:x.id,name:x.name,data:x.data||{},createdAt:x.created_at,updatedAt:x.updated_at,syncStatus:'synced'},i=D.templates.findIndex(y=>y.id===x.id);if(i<0)D.templates.push(n);else if(D.templates[i].syncStatus==='synced')D.templates[i]=n}saveLocal()}catch(e){console.error(e);saveLocal()}render()}
function login(error=''){document.body.innerHTML=`<div class="login"><div class="login-card"><div class="brand"><div class="brand-mark">PH</div><h1>PRIME HOSPITAL</h1><div class="muted">OPD MANAGEMENT SYSTEM</div></div>${error?`<div class="error">${esc(error)}</div>`:''}<div class="field"><label>EMAIL</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn primary wide" id="loginBtn">LOGIN</button><div class="login-links"><button class="link" id="signup">CREATE DOCTOR ACCOUNT</button><button class="link" id="reset">FORGOT PASSWORD</button></div></div></div>`;$('#loginBtn').onclick=doLogin;$('#password').onkeydown=e=>{if(e.key==='Enter')doLogin()};$('#signup').onclick=signup;$('#reset').onclick=resetPw}
async function doLogin(){const email=$('#email').value.trim(),password=$('#password').value;if(!email||!password)return login('ENTER EMAIL AND PASSWORD.');$('#loginBtn').disabled=true;$('#loginBtn').textContent='SIGNING IN…';const r=await db.auth.signInWithPassword({email,password});if(r.error)return login('LOGIN FAILED: '+r.error.message);session=r.data.session;await sync();render()}
async function signup(){const email=prompt('ENTER DOCTOR EMAIL');if(!email)return;const password=prompt('CREATE PASSWORD (MINIMUM 6 CHARACTERS)');if(!password)return;const r=await db.auth.signUp({email:email.trim(),password});alert(r.error?r.error.message:(r.data.session?'ACCOUNT CREATED AND LOGGED IN.':'ACCOUNT CREATED. CHECK YOUR EMAIL IF CONFIRMATION IS REQUIRED.'))}
async function resetPw(){const email=prompt('ENTER YOUR DOCTOR EMAIL');if(!email)return;const r=await db.auth.resetPasswordForEmail(email.trim(),{redirectTo:location.origin});alert(r.error?r.error.message:'PASSWORD RESET EMAIL SENT.')}
async function logout(){await db.auth.signOut();session=null;login()}
function shell(){document.body.innerHTML=`<header class="topbar"><div class="top-brand">PRIME HOSPITAL • OPD</div><div class="top-actions"><span class="pill">${navigator.onLine?'ONLINE':'OFFLINE'}</span><span class="pill">${D.visits.some(v=>v.syncStatus!=='synced')?'PENDING SYNC':'SYNCED'}</span><button class="btn secondary" id="logout">LOGOUT</button></div></header><div class="layout"><aside class="sidebar"><nav class="nav">${[['home','⌂ HOME'],['consult','＋ NEW CONSULTATION'],['patients','▣ PATIENTS & HISTORY'],['dashboard','▥ DASHBOARD'],['medicines','▤ MEDICINE LIBRARY'],['templates','▧ TREATMENT TEMPLATES'],['shortcuts','★ CLINICAL SHORTCUTS']].map(x=>`<button class="${view===x[0]?'active':''}" data-v="${x[0]}">${x[1]}</button>`).join('')}</nav></aside><main class="main" id="main"></main></div>`;$('#logout').onclick=logout;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;editingPatient=null;editingVisit=null;render()})}
function render(){if(!session)return login();shell();({home,consult,patients,dashboard,medicines,templates,shortcuts}[view]||home)($('#main'))}
function home(m){m.innerHTML=`<div class="page-title"><h2>HOME</h2><span class="muted">${today()}</span></div><div class="grid cards">${[['TODAY\'S VISITS',D.visits.filter(v=>v.date===today()).length],['PATIENTS',D.patients.length],['MEDICINES',D.medicines.length],['PENDING SYNC',D.visits.filter(v=>v.syncStatus!=='synced').length]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="stat">${x[1]}</div></div>`).join('')}</div><div class="section"><h3>QUICK ACTIONS</h3><div class="toolbar"><button class="btn primary" onclick="view='consult';render()">NEW CONSULTATION</button><button class="btn secondary" onclick="view='patients';render()">PATIENTS & HISTORY</button><button class="btn secondary" onclick="view='dashboard';render()">DASHBOARD</button></div><div class="muted">LOCAL-FIRST • PRIVATE • CLOUD SYNC WHEN ONLINE</div></div>`}
function inp(n,l,v='',type='text',ph=''){return `<div class="field"><label>${l}</label><input name="${n}" type="${type}" value="${esc(v)}" placeholder="${ph}"></div>`}function ta(n,l,v='',cl='span2'){return `<div class="field ${cl}"><label>${l}</label><textarea name="${n}" rows="2">${esc(v)}</textarea></div>`}
function consult(m){const p=editingPatient||{},v=editingVisit||{};m.innerHTML=`<div class="page-title"><h2>${editingVisit?'OPEN VISIT':'NEW CONSULTATION'}</h2><span class="muted">DATE: <b>${v.date||today()}</b></span></div><form id="cf"><div class="section"><h3>PATIENT DETAILS</h3><div class="form-grid">${inp('firstName','FIRST NAME *',p.firstName||v.firstName)}<div class="field"><label>UHID</label><input name="uhid" readonly value="${esc(p.uhid||v.uhid||uhid())}"></div>${inp('age','AGE',p.age||v.age,'number')}${inp('sex','SEX',p.sex||v.sex)}${inp('mobile','MOBILE',p.mobile||v.mobile)}${inp('bp','BP',v.bp,'text','120/80')}${inp('pulse','PULSE',v.pulse)}${inp('spo2','SPO2',v.spo2)}${inp('rr','RR',v.rr)}${inp('temp','TEMP',v.temp)}${inp('weight','WEIGHT (KG)',v.weight)}${inp('sugar','SUGAR',v.sugar)}</div></div><div class="section"><h3>CLINICAL DETAILS</h3><div class="form-grid">${ta('complaints','COMPLAINTS',v.complaints)}${ta('knownCase','KNOWN CASE OF',v.knownCase,'span2')}${ta('habits','HABITS',v.habits,'span2')}${ta('history','HISTORY',v.history,'span4')}${ta('examination','EXAMINATION',v.examination,'span4')}${ta('pd','PD (PROVISIONAL DIAGNOSIS)',v.pd,'span2')}${ta('investigation','INVESTIGATION',v.investigation,'span2')}${ta('advice','ADVICE',v.advice,'span2')}${ta('management','MANAGEMENT',v.management,'span2')}</div></div><div class="section"><h3>PRESCRIPTION / MEDICINES</h3><div id="medRows">${(v.medicines||[]).length?(v.medicines||[]).map(medRow).join(''):medRow({})}</div><button type="button" class="btn secondary" onclick="addMed()">＋ ADD MEDICINE</button></div><div class="section consult-actions"><button type="button" class="btn secondary" onclick="view='home';render()">CANCEL</button><button type="button" class="btn secondary" onclick="saveVisit(true)">SAVE & PRINT</button><button class="btn primary">SAVE VISIT</button></div></form>`;$('#cf').onsubmit=e=>{e.preventDefault();saveVisit(false)};document.querySelectorAll('#cf input,#cf textarea').forEach(x=>{x.addEventListener('blur',()=>{if(x.name!=='mobile')x.value=clinical(x.value)});x.addEventListener('keydown',e=>{if(e.key==='Enter'&&!['TEXTAREA'].includes(x.tagName)){e.preventDefault();const a=[...document.querySelectorAll('#cf input,#cf textarea')],i=a.indexOf(x);a[i+1]?.focus()}})});if(!$('#medicineList'))document.body.insertAdjacentHTML('beforeend',`<datalist id="medicineList">${D.medicines.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>`)}
function medRow(x={}){return `<div class="medicine-row" data-row><input data-k="name" list="medicineList" placeholder="MEDICINE" value="${esc(x.name)}"><input data-k="dose" placeholder="DOSE" value="${esc(x.dose)}"><input data-k="frequency" placeholder="FREQUENCY" value="${esc(x.frequency)}"><input data-k="duration" placeholder="DURATION" value="${esc(x.duration)}"><button type="button" class="btn danger" onclick="this.parentElement.remove()">×</button></div>`}function addMed(){$('#medRows').insertAdjacentHTML('beforeend',medRow());}
function getMeds(){return [...document.querySelectorAll('[data-row]')].map(r=>Object.fromEntries([...r.querySelectorAll('[data-k]')].map(x=>[x.dataset.k,clinical(x.value.trim())]))).filter(x=>x.name)}
async function saveVisit(print){if(saving)return;saving=true;try{const f=new FormData($('#cf')),first=clinical(f.get('firstName')).trim();if(!first){alert('FIRST NAME IS REQUIRED.');return}const p={id:editingPatient?.id||id(),uhid:f.get('uhid'),firstName:first,age:f.get('age'),sex:clinical(f.get('sex')),mobile:f.get('mobile'),createdAt:editingPatient?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString(),syncStatus:'pending'};const pi=D.patients.findIndex(x=>x.id===p.id);if(pi>=0)D.patients[pi]={...D.patients[pi],...p};else D.patients.push(p);const v={id:editingVisit?.id||id(),patientId:p.id,date:editingVisit?.date||today(),firstName:p.firstName,uhid:p.uhid,age:p.age,sex:p.sex,mobile:p.mobile,bp:clinical(f.get('bp')),pulse:clinical(f.get('pulse')),spo2:clinical(f.get('spo2')),rr:clinical(f.get('rr')),temp:clinical(f.get('temp')),weight:clinical(f.get('weight')),sugar:clinical(f.get('sugar')),complaints:clinical(f.get('complaints')),knownCase:clinical(f.get('knownCase')),habits:clinical(f.get('habits')),history:clinical(f.get('history')),examination:clinical(f.get('examination')),pd:clinical(f.get('pd')),investigation:clinical(f.get('investigation')),advice:clinical(f.get('advice')),management:clinical(f.get('management')),medicines:getMeds(),createdAt:editingVisit?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString(),syncStatus:'pending'};const vi=D.visits.findIndex(x=>x.id===v.id);if(vi>=0)D.visits[vi]=v;else D.visits.push(v);saveLocal();await sync();if(print)printRx(v,p);else{editingPatient=null;editingVisit=null;view='patients';render()}}finally{saving=false}}
function patients(m){const q=($('#search')?.value||'').toLowerCase();const ps=D.patients.filter(p=>[p.firstName,p.uhid,p.mobile].join(' ').toLowerCase().includes(q));m.innerHTML=`<div class="page-title"><h2>PATIENTS & HISTORY</h2><button class="btn primary" onclick="editingPatient=null;editingVisit=null;view='consult';render()">＋ NEW CONSULTATION</button></div><div class="section"><div class="toolbar"><input id="search" placeholder="SEARCH NAME / UHID / MOBILE" value="${esc(q)}"><button class="btn secondary" onclick="$('#search').value='';patients($('#main'))">CLEAR</button></div><div class="table-wrap"><table class="table"><thead><tr><th>UHID</th><th>NAME</th><th>AGE/SEX</th><th>MOBILE</th><th>VISITS</th><th>ACTION</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.uhid)}</td><td>${esc(p.firstName)}</td><td>${esc(p.age)} / ${esc(p.sex)}</td><td>${esc(p.mobile)}</td><td>${D.visits.filter(v=>v.patientId===p.id).length}</td><td><button class="btn secondary" onclick="openPatient('${p.id}')">OPEN HISTORY</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">NO PATIENTS FOUND.</td></tr>'}</tbody></table></div></div>`;$('#search').oninput=()=>patients($('#main'))}
function openPatient(pid){const p=D.patients.find(x=>x.id===pid),vs=D.visits.filter(v=>v.patientId===pid).sort((a,b)=>b.date.localeCompare(a.date));editingPatient=p;$('#main').innerHTML=`<div class="page-title"><div><h2>${esc(p.firstName)}</h2><div class="muted">${esc(p.uhid)} • ${esc(p.age)} / ${esc(p.sex)} • ${esc(p.mobile)}</div></div><button class="btn primary" onclick="editingVisit=null;view='consult';render()">NEW VISIT</button></div><div class="section"><h3>VISIT HISTORY</h3><div class="table-wrap"><table class="table"><thead><tr><th>DATE</th><th>COMPLAINTS</th><th>DIAGNOSIS</th><th>MEDICINES</th><th>ACTION</th></tr></thead><tbody>${vs.map(v=>`<tr><td>${esc(v.date)}</td><td>${esc(v.complaints)}</td><td>${esc(v.pd)}</td><td>${esc((v.medicines||[]).map(x=>x.name).join(', '))}</td><td><button class="btn secondary" onclick="editingVisit=D.visits.find(x=>x.id==='${v.id}');view='consult';render()">OPEN</button> <button class="btn secondary" onclick="printRx(D.visits.find(x=>x.id==='${v.id}'),D.patients.find(x=>x.id==='${pid}'))">PRINT</button> <button class="btn danger" onclick="deleteVisit('${v.id}')">DELETE</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">NO VISITS.</td></tr>'}</tbody></table></div></div>`}
function deleteVisit(vid){if(!confirm('DELETE THIS VISIT? THIS CANNOT BE UNDONE.'))return;D.visits=D.visits.filter(v=>v.id!==vid);saveLocal();sync();openPatient(editingPatient.id)}
function dashboard(m){const vs=D.visits.slice().sort((a,b)=>b.date.localeCompare(a.date));m.innerHTML=`<div class="page-title"><h2>DASHBOARD</h2></div><div class="grid cards">${[['TOTAL VISITS',vs.length],['TOTAL PATIENTS',D.patients.length],['SYNCED',vs.filter(v=>v.syncStatus==='synced').length],['PENDING',vs.filter(v=>v.syncStatus!=='synced').length]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="stat">${x[1]}</div></div>`).join('')}</div><div class="section"><h3>RECENT VISITS</h3><div class="table-wrap"><table class="table"><thead><tr><th>DATE</th><th>UHID</th><th>NAME</th><th>DIAGNOSIS</th><th>ACTION</th></tr></thead><tbody>${vs.slice(0,25).map(v=>`<tr><td>${esc(v.date)}</td><td>${esc(v.uhid)}</td><td>${esc(v.firstName)}</td><td>${esc(v.pd)}</td><td><button class="btn secondary" onclick="editingPatient=D.patients.find(x=>x.id==='${v.patientId}');editingVisit=D.visits.find(x=>x.id==='${v.id}');view='consult';render()">OPEN</button></td></tr>`).join('')}</tbody></table></div></div>`}
function medicines(m){m.innerHTML=`<div class="page-title"><h2>MEDICINE LIBRARY</h2></div><div class="section"><div class="toolbar"><input id="mn" placeholder="MEDICINE NAME"><button class="btn primary" onclick="addMedicine()">＋ ADD MEDICINE</button></div><div class="table-wrap"><table class="table"><thead><tr><th>MEDICINE</th><th>ACTION</th></tr></thead><tbody>${D.medicines.map(x=>`<tr><td>${esc(x.name)}</td><td><button class="btn secondary" onclick="editMedicine('${x.id}')">EDIT</button> <button class="btn danger" onclick="deleteMedicine('${x.id}')">DELETE</button></td></tr>`).join('')||'<tr><td colspan="2" class="empty">NO MEDICINES.</td></tr>'}</tbody></table></div></div>`}
function addMedicine(){const n=clinical($('#mn').value).trim();if(!n)return;D.medicines.push({id:id(),name:n,data:{},createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),syncStatus:'pending'});saveLocal();sync();render()}function editMedicine(i){const x=D.medicines.find(y=>y.id===i),n=prompt('MEDICINE NAME',x.name);if(n===null)return;x.name=clinical(n).trim();x.syncStatus='pending';x.updatedAt=new Date().toISOString();saveLocal();sync();render()}function deleteMedicine(i){if(!confirm('DELETE MEDICINE FROM LIBRARY?'))return;D.medicines=D.medicines.filter(x=>x.id!==i);saveLocal();sync();render()}
function templates(m){m.innerHTML=`<div class="page-title"><h2>TREATMENT TEMPLATES</h2><button class="btn primary" onclick="newTemplate()">＋ NEW TEMPLATE</button></div><div class="template-grid">${D.templates.map(x=>`<div class="template-card"><h4>${esc(x.name)}</h4><div class="muted">${esc(x.data?.pd||'')}</div><br><button class="btn primary" onclick="applyTemplate('${x.id}')">APPLY</button> <button class="btn secondary" onclick="editTemplate('${x.id}')">EDIT</button> <button class="btn danger" onclick="deleteTemplate('${x.id}')">DELETE</button></div>`).join('')||'<div class="empty">NO TEMPLATES.</div>'}</div>`}function newTemplate(){const name=prompt('TEMPLATE NAME');if(!name)return;const pd=prompt('PROVISIONAL DIAGNOSIS');const treatment=prompt('TREATMENT');const investigation=prompt('INVESTIGATION');const advice=prompt('ADVICE');D.templates.push({id:id(),name:clinical(name),data:{pd:clinical(pd),treatment:clinical(treatment),investigation:clinical(investigation),advice:clinical(advice)},createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),syncStatus:'pending'});saveLocal();sync();render()}function editTemplate(i){const x=D.templates.find(y=>y.id===i);const name=prompt('TEMPLATE NAME',x.name);if(name===null)return;x.name=clinical(name);x.data.pd=clinical(prompt('PROVISIONAL DIAGNOSIS',x.data.pd)||'');x.data.treatment=clinical(prompt('TREATMENT',x.data.treatment)||'');x.data.investigation=clinical(prompt('INVESTIGATION',x.data.investigation)||'');x.data.advice=clinical(prompt('ADVICE',x.data.advice)||'');x.syncStatus='pending';saveLocal();sync();render()}function deleteTemplate(i){if(!confirm('DELETE TEMPLATE?'))return;D.templates=D.templates.filter(x=>x.id!==i);saveLocal();sync();render()}function applyTemplate(i){const x=D.templates.find(y=>y.id===i);editingPatient=null;editingVisit={date:today(),pd:x.data.pd,management:x.data.treatment,investigation:x.data.investigation,advice:x.data.advice,medicines:[]};view='consult';render()}
const SHORT=[['FEVER','FEVER WITH CHILLS / BODYACHE'],['URTI','COUGH / COLD / SORE THROAT'],['GASTRITIS','ACIDITY / EPIGASTRIC PAIN'],['DIARRHOEA','LOOSE STOOLS / ABDOMINAL DISCOMFORT'],['HTN','KNOWN CASE OF HYPERTENSION'],['DM','KNOWN CASE OF DIABETES MELLITUS'],['FOLLOW-UP','FOLLOW-UP / REVIEW OF TREATMENT'],['DRESSING','WOUND DRESSING / LOCAL CARE'],['ECG','ECG ADVISED / PERFORMED']];function shortcuts(m){m.innerHTML=`<div class="page-title"><h2>CLINICAL SHORTCUTS</h2></div><div class="shortcut-grid">${SHORT.map(x=>`<button class="shortcut" onclick="useShortcut('${x[1]}')"><b>${x[0]}</b><span class="muted">${x[1]}</span></button>`).join('')}</div>`}function useShortcut(t){editingPatient=null;editingVisit={date:today(),complaints:t};view='consult';render()}
function printRx(v,p){const meds=(v.medicines||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.dose)}</td><td>${esc(x.frequency)}</td><td>${esc(x.duration)}</td></tr>`).join('');const w=window.open('','_blank');if(!w)return;w.document.write(`<!doctype html><html><head><title>Prescription - ${esc(p.firstName)}</title><style>@page{size:A5;margin:10mm 8mm}body{font-family:Arial,sans-serif;margin:0;font-size:13px;color:#111}.head{border-bottom:2px solid #111;padding-bottom:7px;margin-bottom:8px}.hospital{font-size:20px;font-weight:800}.doctor{font-size:12px}.top{display:flex;justify-content:space-between;font-weight:700;margin:8px 0}.row{margin:5px 0}.label{font-weight:800}.clinical{white-space:pre-wrap}.compact{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:11px}.med{width:100%;border-collapse:collapse;margin-top:7px}.med th,.med td{border:1px solid #aaa;padding:5px;text-align:left}.sign{margin-top:35px;text-align:right;font-weight:700}@media print{button{display:none}}</style></head><body><div class="head"><div class="hospital">PRIME HOSPITAL</div><div class="doctor">DR. ADNAN AHMED HIDAYATULLAH KHAN • MBBS • CCDM • ACCD</div></div><div class="top"><span>${esc(p.firstName)}</span><span>DATE: ${esc(v.date)}</span></div><div class="compact"><span>BP: ${esc(v.bp)}</span><span>P: ${esc(v.pulse)}</span><span>SPO2: ${esc(v.spo2)}</span><span>RR: ${esc(v.rr)}</span><span>T: ${esc(v.temp)}</span><span>WT: ${esc(v.weight)}</span></div><div class="row"><span class="label">COMPLAINTS:</span> ${esc(v.complaints)}</div><div class="row"><span class="label">KNOWN CASE OF:</span> ${esc(v.knownCase)} &nbsp; <span class="label">HABITS:</span> ${esc(v.habits)}</div><div class="row"><span class="label">HISTORY:</span> ${esc(v.history)}</div><div class="row"><span class="label">EXAMINATION:</span> ${esc(v.examination)}</div><div class="row"><span class="label">PD:</span> ${esc(v.pd)} &nbsp; <span class="label">INVESTIGATION:</span> ${esc(v.investigation)}</div><div class="row"><span class="label">ADVICE:</span> ${esc(v.advice)} &nbsp; <span class="label">MANAGEMENT:</span> ${esc(v.management)}</div><table class="med"><thead><tr><th>MEDICINE</th><th>DOSE</th><th>FREQUENCY</th><th>DURATION</th></tr></thead><tbody>${meds}</tbody></table><div class="sign">DR. ADNAN AHMED HIDAYATULLAH KHAN<br>PRIME HOSPITAL</div><script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`);w.document.close()}
async function boot(){load();db=window.supabase.createClient(CONFIG.url,CONFIG.key);db.auth.onAuthStateChange((e,s)=>{session=s;if(!s)login()});const r=await db.auth.getSession();session=r.data.session;if(session){await sync()}else login()}window.addEventListener('online',()=>session&&sync());window.addEventListener('offline',()=>{if($('#main'))render()});boot();
</script></body></html>
