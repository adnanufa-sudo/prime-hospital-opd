<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#f4f7f7;color:#17202a}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#e7f6f3,#f8fbfb)}.login-card{width:min(440px,100%);background:#fff;border:1px solid #dce7e5;border-radius:18px;padding:32px;box-shadow:0 18px 60px #0002}.brand{text-align:center;margin-bottom:24px}.brand-mark{width:68px;height:68px;border-radius:50%;margin:auto;display:grid;place-items:center;background:#0f766e;color:#fff;font-weight:900;font-size:23px}.brand h1{margin:12px 0 4px;font-size:24px}.muted{color:#667085;font-size:13px}.error{background:#fee4e2;color:#b42318;padding:10px;border-radius:8px;margin:10px 0;font-size:13px}.ok{background:#e7f6ef;color:#067647;padding:10px;border-radius:8px;margin:10px 0;font-size:13px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.field label{font-size:11px;font-weight:800;letter-spacing:.4px}.field input,.field select,.field textarea,.toolbar input{width:100%;border:1px solid #cfd8dc;border-radius:7px;padding:9px;background:#fff;outline:none}.field textarea{resize:vertical;min-height:44px}.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus{border-color:#0f766e;box-shadow:0 0 0 2px #0f766e22}.btn{border:0;border-radius:7px;padding:9px 13px;font-weight:700}.primary{background:#0f766e;color:#fff}.secondary{background:#e8eeee;color:#234}.danger{background:#fee4e2;color:#b42318}.wide{width:100%;margin-top:7px}.login-links{display:flex;justify-content:space-between;margin-top:14px;gap:10px}.link{border:0;background:none;color:#0f766e;font-size:12px;font-weight:700;padding:0}
.topbar{height:60px;background:#0f766e;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}.top-brand{font-weight:900}.top-actions{display:flex;gap:8px;align-items:center}.pill{background:#ffffff22;border:1px solid #ffffff44;padding:5px 9px;border-radius:99px;font-size:11px}.layout{display:flex;min-height:calc(100vh - 60px)}.sidebar{width:240px;background:#fff;border-right:1px solid #dce4e4;padding:14px;flex:0 0 240px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{text-align:left;background:none;border:0;padding:11px;border-radius:7px;font-weight:700;color:#475467}.nav button.active,.nav button:hover{background:#e5f3f1;color:#0f766e}.main{flex:1;padding:22px;max-width:1500px;width:100%;margin:auto}.page-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}.page-title h2{margin:0;font-size:21px}.grid{display:grid;gap:12px}.cards{grid-template-columns:repeat(4,1fr)}.card,.section{background:#fff;border:1px solid #e0e7e7;border-radius:10px;padding:16px;margin-bottom:14px}.stat{font-size:27px;font-weight:800;margin-top:8px}.section h3{margin:0 0 13px;font-size:13px}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:13px;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.span2{grid-column:span 2}.span4{grid-column:1/-1}.medicine-row{display:grid;grid-template-columns:2fr 1fr 1.3fr 1fr auto;gap:7px;margin-bottom:8px}.medicine-row input{border:1px solid #cfd8dc;border-radius:7px;padding:9px;min-width:0}.quickbar{display:flex;gap:5px;overflow-x:auto;padding:1px 0 7px;margin-top:-4px}.quickbar button{white-space:nowrap;border:1px solid #cfd8dc;background:#f8faf9;border-radius:99px;padding:5px 8px;font-size:11px}.quickbar button:hover{background:#e5f3f1}.consult-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px 8px;border-bottom:1px solid #e6ebeb;text-align:left;vertical-align:top}.table th{font-size:11px;color:#667085;background:#f8faf9;white-space:nowrap}.empty{padding:25px;text-align:center;color:#667085}.template-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.template-card{border:1px solid #dce4e4;border-radius:8px;padding:12px}.template-card h4{margin:0 0 6px}.shortcut-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.shortcut{padding:14px;background:#fff;border:1px solid #dce4e4;border-radius:8px;text-align:left}.shortcut b{display:block;margin-bottom:5px}.toast{position:fixed;right:18px;bottom:18px;background:#17202a;color:#fff;padding:11px 15px;border-radius:8px;z-index:100;max-width:380px}.status{font-size:12px;margin:8px 0}.latest{background:#f8faf9;border-left:4px solid #0f766e;padding:12px;border-radius:7px;margin-bottom:12px}.modal-backdrop{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:20px;z-index:80}.modal{background:#fff;border-radius:12px;width:min(900px,100%);max-height:90vh;overflow:auto;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modal-head h3{margin:0}.print-preview{background:#fff;max-width:900px;margin:auto;padding:20px}.print-head{display:flex;justify-content:space-between;border-bottom:1px solid #222;padding-bottom:8px;margin-bottom:8px}.print-head b{font-size:18px}.print-line{margin:5px 0;line-height:1.35}.print-vitals{display:flex;gap:14px;flex-wrap:wrap;border-bottom:1px solid #bbb;padding-bottom:5px;margin-bottom:5px;font-size:12px}.print-clinical{white-space:pre-wrap}.print-rx{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}.print-rx th,.print-rx td{border:1px solid #777;padding:5px;text-align:left}.print-sign{text-align:right;margin-top:35px}.mode{border:1px solid #ffffff55;background:#ffffff15;color:#fff;border-radius:7px;padding:6px 8px}
@media(max-width:900px){.sidebar{width:190px;flex-basis:190px}.cards{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:repeat(2,1fr)}.shortcut-grid,.template-grid{grid-template-columns:1fr}}@media(max-width:650px){.layout{display:block}.sidebar{width:100%;border-right:0;border-bottom:1px solid #dce4e4}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.main{padding:12px}.cards{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.span2,.span4{grid-column:auto}.medicine-row{grid-template-columns:1fr 1fr}.top-brand{font-size:12px}.top-actions .pill{display:none}}
@media print{body{background:#fff}.no-print{display:none!important}.print-preview{padding:0;max-width:none}.print-head{margin-top:0}.print-clinical{font-size:12px} }

<body><div id="app"></div>
<script>
'use strict';
const SUPABASE_URL='https://xcvjyohvrfakhxoevlff.supabase.co';
const SUPABASE_KEY='sb_publishable_m7rsHfm0OpEtSrQui8HAiA_59l_S3UV';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const STORE='prime-hospital-opd-v5';
const D={patients:[],visits:[],medicines:[],templates:[]};
let session=null,view='home',patient=null,visit=null,focusedField=null,syncing=false;
const $=s=>document.querySelector(s),today=()=>new Date().toISOString().slice(0,10),now=()=>new Date().toISOString(),uid=()=>crypto.randomUUID();
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clinical=v=>String(v??'').toUpperCase();
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2800)}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(STORE)||'{}');for(const k of Object.keys(D))D[k]=Array.isArray(x[k])?x[k]:[]}catch(e){console.warn(e)}}
function saveLocal(){localStorage.setItem(STORE,JSON.stringify(D))}
function nextUHID(){const n=D.patients.reduce((m,p)=>Math.max(m,parseInt(String(p.uhid||'').replace(/\D/g,''),10)||0),0);return 'PH-'+String(n+1).padStart(6,'0')}
function pending(){return Object.values(D).flat().filter(x=>x?.syncStatus==='pending').length}
function mapPatientRow(p){return {id:p.id,uhid:p.uhid,firstName:p.first_name,age:p.age||'',sex:p.sex||'',mobile:p.mobile||'',createdAt:p.created_at,updatedAt:p.updated_at,syncStatus:'synced'}}
function mapVisitRow(v){const c=v.clinical||{};return {id:v.id,patientId:v.patient_id,date:v.visit_date,...c,medicines:v.medicines||[],createdAt:v.created_at,updatedAt:v.updated_at,syncStatus:'synced'}}
function mapLibRow(x){return {id:x.id,name:x.name,data:x.data||{},createdAt:x.created_at,updatedAt:x.updated_at,syncStatus:'synced'}}
async function sync(){if(!session||!navigator.onLine||syncing)return;syncing=true;setStatus('SYNCING…');try{const userId=session.user.id;
  for(const p of D.patients.filter(x=>x.syncStatus==='pending')){const r=await db.from('patients').upsert({id:p.id,user_id:userId,uhid:p.uhid,first_name:p.firstName,age:p.age||null,sex:p.sex||null,mobile:p.mobile||null,created_at:p.createdAt||now(),updated_at:p.updatedAt||now()},{onConflict:'id'});if(r.error)throw r.error;p.syncStatus='synced'}
  for(const v of D.visits.filter(x=>x.syncStatus==='pending')){const clinicalData={firstName:v.firstName,uhid:v.uhid,age:v.age,sex:v.sex,mobile:v.mobile,weight:v.weight,bp:v.bp,pulse:v.pulse,spo2:v.spo2,rr:v.rr,temp:v.temp,sugar:v.sugar,complaints:v.complaints,knownCase:v.knownCase,habits:v.habits,history:v.history,examination:v.examination,pd:v.pd,treatment:v.treatment,investigation:v.investigation,advice:v.advice,management:v.management};const r=await db.from('visits').upsert({id:v.id,user_id:userId,patient_id:v.patientId,visit_date:v.date,clinical:clinicalData,medicines:v.medicines||[],created_at:v.createdAt||now(),updated_at:v.updatedAt||now()},{onConflict:'id'});if(r.error)throw r.error;v.syncStatus='synced'}
  for(const x of D.medicines.filter(x=>x.syncStatus==='pending')){const r=await db.from('medicines').upsert({id:x.id,user_id:userId,name:x.name,data:x.data||{},created_at:x.createdAt||now(),updated_at:x.updatedAt||now()},{onConflict:'id'});if(r.error)throw r.error;x.syncStatus='synced'}
  for(const x of D.templates.filter(x=>x.syncStatus==='pending')){const r=await db.from('templates').upsert({id:x.id,user_id:userId,name:x.name,data:x.data||{},created_at:x.createdAt||now(),updated_at:x.updatedAt||now()},{onConflict:'id'});if(r.error)throw r.error;x.syncStatus='synced'}
  const [ps,vs,ms,ts]=await Promise.all([db.from('patients').select('*'),db.from('visits').select('*'),db.from('medicines').select('*'),db.from('templates').select('*')]);for(const r of [ps,vs,ms,ts])if(r.error)throw r.error;
  D.patients=(ps.data||[]).map(mapPatientRow);D.visits=(vs.data||[]).map(mapVisitRow);D.medicines=(ms.data||[]).map(mapLibRow);D.templates=(ts.data||[]).map(mapLibRow);saveLocal();setStatus('SYNCED');
 }catch(e){console.error(e);saveLocal();setStatus(navigator.onLine?'SYNC ERROR':'OFFLINE');toast('CLOUD SYNC FAILED — LOCAL DATA IS SAFE.')}finally{syncing=false;if(view!=='consult'||!$('#cf'))render()}}
function setStatus(t){const n=$('#syncStatus');if(n)n.textContent=t}
function loginScreen(msg='',ok=''){document.body.innerHTML=`<div class="login"><div class="login-card"><div class="brand"><div class="brand-mark">PH</div><h1>PRIME HOSPITAL</h1><div class="muted">OPD MANAGEMENT SYSTEM</div></div>${msg?`<div class="error">${esc(msg)}</div>`:''}${ok?`<div class="ok">${esc(ok)}</div>`:''}<form id="loginForm"><div class="field"><label>EMAIL</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary wide" id="loginBtn" type="submit">LOGIN</button></form><div class="login-links"><button class="link" id="signup" type="button">CREATE DOCTOR ACCOUNT</button><button class="link" id="reset" type="button">FORGOT PASSWORD</button></div><div class="muted" style="margin-top:16px;text-align:center">PRIVATE • SECURE • LOCAL-FIRST</div></div></div>`;$('#loginForm').onsubmit=e=>{e.preventDefault();doLogin()};$('#signup').onclick=signup;$('#reset').onclick=resetPassword}
async function doLogin(){const email=$('#email').value.trim(),password=$('#password').value,b=$('#loginBtn');b.disabled=true;b.textContent='SIGNING IN…';const r=await db.auth.signInWithPassword({email,password});if(r.error){loginScreen('LOGIN FAILED: '+r.error.message);return}session=r.data.session;loadLocal();await sync();render()}
async function signup(){const email=$('#email').value.trim(),password=$('#password').value;if(!email||!password){loginScreen('ENTER EMAIL AND PASSWORD BEFORE CREATING THE ACCOUNT.');return}if(password.length<6){loginScreen('PASSWORD MUST BE AT LEAST 6 CHARACTERS.');return}const r=await db.auth.signUp({email,password});if(r.error){loginScreen('ACCOUNT CREATION FAILED: '+r.error.message);return}if(r.data.session){session=r.data.session;render()}else loginScreen('', 'ACCOUNT CREATED. CHECK YOUR EMAIL IF CONFIRMATION IS REQUIRED, THEN LOGIN.')}
async function resetPassword(){const email=$('#email').value.trim();if(!email){loginScreen('ENTER YOUR EMAIL FIRST.');return}const r=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});loginScreen(r.error?'RESET FAILED: '+r.error.message:'',r.error?'':'PASSWORD RESET EMAIL SENT. CHECK YOUR EMAIL.')}
async function logout(){await db.auth.signOut();session=null;patient=null;visit=null;loginScreen()}
function shell(){document.body.innerHTML=`<header class="topbar"><div class="top-brand">PRIME HOSPITAL • OPD</div><div class="top-actions"><span class="pill">${navigator.onLine?'ONLINE':'OFFLINE'}</span><span class="pill" id="syncStatus">${pending()?'PENDING SYNC':'SYNCED'}</span><button class="mode" id="refresh">↻ SYNC</button><button class="btn secondary" id="logout">LOGOUT</button></div></header><div class="layout"><aside class="sidebar"><nav class="nav">${[['home','⌂ HOME'],['consult','＋ NEW CONSULTATION'],['patients','▣ PATIENTS & HISTORY'],['dashboard','▥ DASHBOARD'],['medicines','▤ MEDICINE LIBRARY'],['templates','▧ TREATMENT TEMPLATES'],['shortcuts','★ CLINICAL SHORTCUTS']].map(([k,t])=>`<button class="${view===k?'active':''}" data-view="${k}">${t}</button>`).join('')}</nav></aside><main class="main" id="main"></main></div>`;$('#logout').onclick=logout;$('#refresh').onclick=()=>sync();document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;if(view!=='consult'){patient=null;visit=null}render()})}
function render(){if(!session)return loginScreen();shell();({home,consult,patients,dashboard,medicines,templates,shortcuts}[view]||home)($('#main'))}
function go(v){view=v;render()}
function home(m){m.innerHTML=`<div class="page-title"><h2>HOME</h2><span class="muted">${today()}</span></div><div class="grid cards">${[['TODAY’S VISITS',D.visits.filter(v=>v.date===today()).length],['PATIENTS',D.patients.length],['MEDICINES',D.medicines.length],['PENDING SYNC',pending()]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="stat">${x[1]}</div></div>`).join('')}</div><div class="section"><h3>QUICK ACTIONS</h3><div class="toolbar"><button class="btn primary" onclick="newConsult()">NEW CONSULTATION</button><button class="btn secondary" onclick="go('patients')">PATIENTS & HISTORY</button><button class="btn secondary" onclick="go('medicines')">MEDICINE LIBRARY</button></div><div class="muted">LOCAL-FIRST STORAGE • CLOUD SYNC WHEN ONLINE</div></div>`}
function input(n,l,v='',extra='',cl=''){return `<div class="field ${cl}"><label>${l}</label><input name="${n}" value="${esc(v)}" ${extra}></div>`}
function area(n,l,v='',cl='span2',quick=[]){return `<div class="field ${cl}"><label>${l}</label><textarea name="${n}" rows="2" data-clinical>${esc(v)}</textarea>${quick.length?`<div class="quickbar">${quick.map(q=>`<button type="button" onclick="addQuick('${n}','${esc(q).replace(/'/g,"\\'")}')">${esc(q)}</button>`).join('')}</div>`:''}</div>`}
const QUICK={complaints:['FEVER','COUGH','COLD','SORE THROAT','BODY ACHE','HEADACHE','VOMITING','DIARRHEA','ABDOMINAL PAIN','BACKACHE','ITCHING'],history:['NO SIGNIFICANT HISTORY','DM','HTN','THYROID','ASTHMA','COPD','ALLERGY'],examination:['GENERAL CONDITION GOOD','PALLOR ABSENT','ICTERUS ABSENT','CYANOSIS ABSENT','EDEMA ABSENT','CHEST CLEAR','CVS NORMAL','CNS NORMAL','P/A SOFT'],pd:['URTI','ACUTE GASTRITIS','VIRAL FEVER','LRTI','ACUTE DIARRHEA','UTI','DERMATITIS','DM','HTN'],investigation:['CBC','RBS','FBS','PPBS','HbA1C','LFT','KFT','URINE R/M','ECG','CHEST X-RAY'],advice:['PLENTY OF ORAL FLUIDS','REST','DIET AS TOLERATED','FOLLOW UP IF NOT BETTER','FOLLOW UP AFTER REPORTS']};
function consult(m){const p=patient||{},v=visit||{},ms=v.medicines||[];const uhid=p.uhid||v.uhid||nextUHID();m.innerHTML=`<div class="page-title"><h2>${visit?'OPEN VISIT':'NEW CONSULTATION'}</h2><span class="muted">DATE: <b>${v.date||today()}</b></span></div><form id="cf" autocomplete="off"><div class="section"><h3>PATIENT DETAILS</h3><div class="form-grid">${input('firstName','FIRST NAME *',p.firstName||v.firstName,'required data-required data-clinical')}<div class="field"><label>UHID</label><input name="uhid" readonly value="${esc(uhid)}"></div>${input('age','AGE',p.age||v.age,'type="number" min="0"')}<div class="field"><label>SEX</label><select name="sex"><option value="">SELECT</option>${['MALE','FEMALE','OTHER'].map(x=>`<option value="${x}" ${x===(p.sex||v.sex)?'selected':''}>${x}</option>`).join('')}</select></div>${input('mobile','MOBILE',p.mobile||v.mobile,'inputmode="tel"')}${input('weight','WEIGHT (KG)',v.weight)}${input('bp','BP',v.bp,'placeholder="120/80"')}${input('pulse','PULSE',v.pulse)}${input('spo2','SPO2',v.spo2)}${input('rr','RR',v.rr)}${input('temp','TEMP',v.temp)}${input('sugar','SUGAR',v.sugar)}</div></div><div class="section"><h3>CLINICAL DETAILS</h3><div class="form-grid">${area('complaints','COMPLAINTS',v.complaints,'span2',QUICK.complaints)}<div class="field span2"><label>KNOWN CASE OF / HABITS</label><input name="knownCase" data-clinical value="${esc(v.knownCase)}"></div>${area('history','HISTORY',v.history,'span2',QUICK.history)}${area('examination','EXAMINATION',v.examination,'span2',QUICK.examination)}${area('pd','PD (PROVISIONAL DIAGNOSIS)',v.pd,'span2',QUICK.pd)}${area('treatment','TREATMENT',v.treatment,'span2')}${area('investigation','INVESTIGATION',v.investigation,'span2',QUICK.investigation)}${area('advice','ADVICE',v.advice,'span2',QUICK.advice)}${area('management','MANAGEMENT',v.management,'span2')}</div></div><div class="section"><h3>PRESCRIPTION / MEDICINES</h3><div id="medRows">${ms.length?ms.map(medRow).join(''):medRow({})}</div><button type="button" class="btn secondary" onclick="addMed()">＋ ADD MEDICINE</button></div><div class="section consult-actions"><button type="button" class="btn secondary" onclick="go('home')">CANCEL</button><button type="button" class="btn secondary" onclick="saveVisit(true)">PREVIEW & PRINT</button><button type="submit" class="btn primary">SAVE VISIT</button></div></form>`;$('#cf').onsubmit=e=>{e.preventDefault();saveVisit(false)};installClinicalInputs();installTabs();medicineList()}
function medRow(x={}){return `<div class="medicine-row" data-med-row><input data-med="name" data-clinical list="medicineList" placeholder="MEDICINE" value="${esc(x.name)}"><input data-med="dose" data-clinical placeholder="DOSE" value="${esc(x.dose)}"><input data-med="frequency" data-clinical placeholder="FREQUENCY" value="${esc(x.frequency)}"><input data-med="duration" data-clinical placeholder="DURATION" value="${esc(x.duration)}"><button type="button" class="btn danger" onclick="this.parentElement.remove()">×</button></div>`}
function addMed(){const r=$('#medRows');r.insertAdjacentHTML('beforeend',medRow());installClinicalInputs();installTabs();r.lastElementChild.querySelector('input')?.focus()}
function medicineList(){let dl=$('#medicineList');if(!dl){dl=document.createElement('datalist');dl.id='medicineList';document.body.appendChild(dl)}dl.innerHTML=D.medicines.map(x=>`<option value="${esc(x.name)}">`).join('')}
function addQuick(field,value){const x=document.querySelector(`[name="${field}"]`);if(!x)return;const current=clinical(x.value).trim(),item=clinical(value);const parts=current?current.split(/\s*[,;]\s*|\n/).map(s=>s.trim()).filter(Boolean):[];if(!parts.includes(item))x.value=current?(current+'; '+item):item;x.dispatchEvent(new Event('input'))}
function installClinicalInputs(){document.querySelectorAll('[data-clinical]').forEach(x=>{x.addEventListener('input',()=>{if(document.activeElement===x&&x.type!=='password'&&x.type!=='email'){const a=x.selectionStart,b=x.selectionEnd;x.value=x.value.toUpperCase();try{x.setSelectionRange(a,b)}catch{}}});x.value=x.value.toUpperCase()})}
function installTabs(){const els=[...document.querySelectorAll('#cf input,#cf select,#cf textarea,#cf button')].filter(x=>!x.disabled&&x.type!=='button');els.forEach((x,i)=>x.onkeydown=e=>{if(e.key==='Enter'&&x.tagName!=='TEXTAREA'){e.preventDefault();els[i+1]?.focus()}})}
function collectMedicines(){return [...document.querySelectorAll('[data-med-row]')].map(r=>Object.fromEntries([...r.querySelectorAll('[data-med]')].map(i=>[i.dataset.med,clinical(i.value.trim())]))).filter(x=>x.name)}
function newConsult(){patient=null;visit=null;go('consult')}
async function saveVisit(printOnly){const f=new FormData($('#cf')),first=clinical(f.get('firstName')).trim();if(!first){toast('FIRST NAME IS REQUIRED.');$('#cf [name="firstName"]').focus();return}const existing=patient||{};const p={id:existing.id||uid(),uhid:f.get('uhid')||nextUHID(),firstName:first,age:f.get('age')||'',sex:f.get('sex')||'',mobile:f.get('mobile')||'',createdAt:existing.createdAt||now(),updatedAt:now(),syncStatus:'pending'};const pi=D.patients.findIndex(x=>x.id===p.id||x.uhid===p.uhid);if(pi>=0){p.id=D.patients[pi].id;D.patients[pi]={...D.patients[pi],...p}}else D.patients.push(p);const v={id:visit?.id||uid(),patientId:p.id,date:visit?.date||today(),firstName:first,uhid:p.uhid,age:p.age,sex:p.sex,mobile:p.mobile,weight:f.get('weight')||'',bp:f.get('bp')||'',pulse:f.get('pulse')||'',spo2:f.get('spo2')||'',rr:f.get('rr')||'',temp:f.get('temp')||'',sugar:f.get('sugar')||'',complaints:clinical(f.get('complaints')),knownCase:clinical(f.get('knownCase')),habits:'',history:clinical(f.get('history')),examination:clinical(f.get('examination')),pd:clinical(f.get('pd')),treatment:clinical(f.get('treatment')),investigation:clinical(f.get('investigation')),advice:clinical(f.get('advice')),management:clinical(f.get('management')),medicines:collectMedicines(),createdAt:visit?.createdAt||now(),updatedAt:now(),syncStatus:'pending'};const vi=D.visits.findIndex(x=>x.id===v.id);if(vi>=0)D.visits[vi]=v;else D.visits.push(v);saveLocal();if(navigator.onLine)await sync();if(printOnly){showPrintPreview(v,p)}else{patient=null;visit=null;toast('VISIT SAVED');go('patients')}}
function patients(m){m.innerHTML=`<div class="page-title"><h2>PATIENTS & HISTORY</h2><button class="btn primary" onclick="newConsult()">＋ NEW CONSULTATION</button></div><div class="section"><div class="toolbar"><input id="ps" placeholder="SEARCH NAME / UHID / MOBILE"><button class="btn secondary" onclick="$('#ps').value='';patientTable()">CLEAR</button></div><div id="pt"></div></div>`;$('#ps').oninput=patientTable;patientTable()}
function patientTable(){const q=($('#ps')?.value||'').toLowerCase();const ps=D.patients.filter(p=>[p.firstName,p.uhid,p.mobile].join(' ').toLowerCase().includes(q));$('#pt').innerHTML=ps.length?`<div class="table-wrap"><table class="table"><thead><tr><th>UHID</th><th>NAME</th><th>AGE/SEX</th><th>MOBILE</th><th>VISITS</th><th>LATEST VISIT</th><th>ACTION</th></tr></thead><tbody>${ps.map(p=>{const vs=D.visits.filter(v=>v.patientId===p.id).sort((a,b)=>b.date.localeCompare(a.date));const latest=vs[0];return `<tr><td>${esc(p.uhid)}</td><td>${esc(p.firstName)}</td><td>${esc(p.age)} / ${esc(p.sex)}</td><td>${esc(p.mobile)}</td><td>${vs.length}</td><td>${esc(latest?.date||'—')}</td><td><button class="btn secondary" onclick="openPatient('${p.id}')">OPEN HISTORY</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">NO PATIENTS FOUND.</div>'}
function openPatient(id){const p=D.patients.find(x=>x.id===id);if(!p)return;patient=p;const vs=D.visits.filter(v=>v.patientId===id).sort((a,b)=>b.date.localeCompare(a.date));const latest=vs[0];$('#main').innerHTML=`<div class="page-title"><div><h2>${esc(p.firstName)}</h2><div class="muted">${esc(p.uhid)} • ${esc(p.age)} / ${esc(p.sex)} • ${esc(p.mobile)}</div></div><div class="toolbar" style="margin:0"><button class="btn secondary" onclick="go('patients')">BACK</button><button class="btn primary" onclick="newVisit('${p.id}')">NEW VISIT</button><button class="btn danger" onclick="deletePatient('${p.id}')">DELETE PATIENT</button></div></div>${latest?`<div class="latest"><b>LATEST VISIT: ${esc(latest.date)}</b><div style="margin-top:5px">COMPLAINTS: ${esc(latest.complaints||'—')}</div><div>DIAGNOSIS: ${esc(latest.pd||'—')}</div><div>MEDICINES: ${esc((latest.medicines||[]).map(x=>x.name).join(', ')||'—')}</div></div>`:''}<div class="section"><h3>VISIT HISTORY</h3>${vs.length?`<div class="table-wrap"><table class="table"><thead><tr><th>DATE</th><th>COMPLAINTS</th><th>DIAGNOSIS</th><th>MEDICINES</th><th>ACTION</th></tr></thead><tbody>${vs.map(v=>`<tr><td>${esc(v.date)}</td><td>${esc(v.complaints)}</td><td>${esc(v.pd)}</td><td>${esc((v.medicines||[]).map(x=>x.name).join(', '))}</td><td><button class="btn secondary" onclick="openVisit('${v.id}')">OPEN</button> <button class="btn secondary" onclick="printVisitById('${v.id}')">PRINT</button> <button class="btn danger" onclick="deleteVisit('${v.id}')">DELETE</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">NO VISITS.</div>'}</div>`}
function newVisit(id){patient=D.patients.find(p=>p.id===id);visit=null;go('consult')}
function openVisit(id){visit=D.visits.find(v=>v.id===id);patient=D.patients.find(p=>p.id===visit?.patientId);go('consult')}
function dashboard(m){const vs=D.visits.slice().sort((a,b)=>b.date.localeCompare(a.date));m.innerHTML=`<div class="page-title"><h2>DASHBOARD</h2></div><div class="grid cards">${[['TOTAL VISITS',vs.length],['TOTAL PATIENTS',D.patients.length],['SYNCED',vs.filter(v=>v.syncStatus==='synced').length],['PENDING',pending()]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="stat">${x[1]}</div></div>`).join('')}</div><div class="section"><h3>RECENT VISITS</h3><div class="table-wrap"><table class="table"><thead><tr><th>DATE</th><th>UHID</th><th>NAME</th><th>DIAGNOSIS</th></tr></thead><tbody>${vs.slice(0,25).map(v=>`<tr><td>${esc(v.date)}</td><td>${esc(v.uhid)}</td><td>${esc(v.firstName)}</td><td>${esc(v.pd)}</td></tr>`).join('')}</tbody></table></div></div>`}
function medicines(m){m.innerHTML=`<div class="page-title"><h2>MEDICINE LIBRARY</h2></div><div class="section"><div class="toolbar"><input id="mn" placeholder="MEDICINE NAME"><button class="btn primary" onclick="addMedicine()">＋ ADD MEDICINE</button></div><div class="table-wrap"><table class="table"><thead><tr><th>MEDICINE</th><th>ACTION</th></tr></thead><tbody>${D.medicines.map(x=>`<tr><td>${esc(x.name)}</td><td><button class="btn secondary" onclick="editMedicine('${x.id}')">EDIT</button> <button class="btn danger" onclick="deleteMedicine('${x.id}')">DELETE</button></td></tr>`).join('')||'<tr><td colspan="2" class="empty">NO MEDICINES.</td></tr>'}</tbody></table></div></div>`}
async function addMedicine(){const name=clinical(prompt('MEDICINE NAME')||'').trim();if(!name)return;if(D.medicines.some(x=>x.name===name)){toast('MEDICINE ALREADY EXISTS.');return}D.medicines.push({id:uid(),name,data:{},createdAt:now(),updatedAt:now(),syncStatus:'pending'});saveLocal();await sync();render()}
async function editMedicine(id){const x=D.medicines.find(m=>m.id===id);if(!x)return;const name=clinical(prompt('EDIT MEDICINE NAME',x.name)||'').trim();if(!name)return;x.name=name;x.updatedAt=now();x.syncStatus='pending';saveLocal();await sync();render()}
async function deleteMedicine(id){if(!confirm('DELETE THIS MEDICINE FROM YOUR LIBRARY?'))return;const x=D.medicines.find(m=>m.id===id);if(session&&navigator.onLine){const r=await db.from('medicines').delete().eq('id',id);if(r.error){toast('DELETE FAILED.');return}}D.medicines=D.medicines.filter(m=>m.id!==id);saveLocal();render()}
function templates(m){m.innerHTML=`<div class="page-title"><h2>TREATMENT TEMPLATES</h2><button class="btn primary" onclick="addTemplate()">＋ ADD TEMPLATE</button></div><div class="template-grid">${D.templates.map(x=>`<div class="template-card"><h4>${esc(x.name)}</h4><div class="muted">${esc(x.data?.diagnosis||'')}</div><div style="margin-top:8px"><button class="btn secondary" onclick="applyTemplate('${x.id}')">APPLY</button> <button class="btn secondary" onclick="editTemplate('${x.id}')">EDIT</button> <button class="btn danger" onclick="deleteTemplate('${x.id}')">DELETE</button></div></div>`).join('')||'<div class="empty">NO TEMPLATES.</div>'}</div>`}
async function addTemplate(){const name=clinical(prompt('TEMPLATE NAME')||'').trim();if(!name)return;const diagnosis=clinical(prompt('PROVISIONAL DIAGNOSIS')||'');const treatment=clinical(prompt('TREATMENT')||'');const investigation=clinical(prompt('INVESTIGATION')||'');const advice=clinical(prompt('ADVICE')||'');const management=clinical(prompt('MANAGEMENT / PROCEDURE')||'');const medicines=collectTemplateMeds();D.templates.push({id:uid(),name,data:{diagnosis,treatment,investigation,advice,management,medicines},createdAt:now(),updatedAt:now(),syncStatus:'pending'});saveLocal();await sync();render()}
function collectTemplateMeds(){const raw=prompt('MEDICINES — ONE PER LINE (NAME | DOSE | FREQUENCY | DURATION)','');if(!raw)return[];return raw.split('\n').map(line=>{const [name,dose,frequency,duration]=line.split('|').map(x=>clinical(x.trim()));return name?{name,dose,frequency,duration}:null}).filter(Boolean)}
function editTemplate(id){const x=D.templates.find(t=>t.id===id);if(!x)return;const n=clinical(prompt('TEMPLATE NAME',x.name)||'').trim();if(!n)return;x.name=n;x.data.diagnosis=clinical(prompt('DIAGNOSIS',x.data.diagnosis)||'');x.data.treatment=clinical(prompt('TREATMENT',x.data.treatment)||'');x.data.investigation=clinical(prompt('INVESTIGATION',x.data.investigation)||'');x.data.advice=clinical(prompt('ADVICE',x.data.advice)||'');x.data.management=clinical(prompt('MANAGEMENT',x.data.management)||'');x.updatedAt=now();x.syncStatus='pending';saveLocal();sync().then(render)}
async function deleteTemplate(id){if(!confirm('DELETE THIS TEMPLATE?'))return;const r=await db.from('templates').delete().eq('id',id);if(r.error){toast('DELETE FAILED.');return}D.templates=D.templates.filter(t=>t.id!==id);saveLocal();render()}
function applyTemplate(id){const x=D.templates.find(t=>t.id===id);if(!x){return}if(view!=='consult'||!$('#cf')){newConsult()}setTimeout(()=>{const d=x.data||{};for(const [k,val] of Object.entries({pd:d.diagnosis,treatment:d.treatment,investigation:d.investigation,advice:d.advice,management:d.management})){const el=document.querySelector(`[name="${k}"]`);if(el)el.value=clinical(val)}if(Array.isArray(d.medicines)&&d.medicines.length){$('#medRows').innerHTML=d.medicines.map(medRow).join('');installClinicalInputs();installTabs()}toast('TEMPLATE APPLIED')},0)}
function shortcuts(m){const fields=[['COMPLAINTS','complaints'],['HISTORY','history'],['EXAMINATION','examination'],['PD','pd'],['INVESTIGATION','investigation'],['ADVICE','advice']];m.innerHTML=`<div class="page-title"><h2>CLINICAL SHORTCUTS</h2></div><div class="shortcut-grid">${fields.map(([label,key])=>`<div class="shortcut"><b>${label}</b><div class="muted">Quick buttons are available directly inside the consultation field.</div><button class="btn primary" style="margin-top:10px" onclick="newConsult();setTimeout(()=>document.querySelector('[name=${key}]')?.focus(),0)">OPEN ${label}</button></div>`).join('')}</div>`}
async function deleteVisit(id){if(!confirm('DELETE THIS VISIT?'))return;const r=await db.from('visits').delete().eq('id',id);if(r.error){toast('DELETE FAILED: '+r.error.message);return}D.visits=D.visits.filter(v=>v.id!==id);saveLocal();openPatient(patient.id)}
async function deletePatient(id){const p=D.patients.find(x=>x.id===id);if(!p)return;const typed=prompt(`TYPE THE UHID ${p.uhid} TO CONFIRM PERMANENT DELETION`);if(typed!==p.uhid)return;if(!confirm('THIS WILL DELETE THE PATIENT AND ALL VISITS. CONTINUE?'))return;const vs=D.visits.filter(v=>v.patientId===id);if(navigator.onLine){for(const v of vs){const r=await db.from('visits').delete().eq('id',v.id);if(r.error){toast('DELETE FAILED.');return}}const r=await db.from('patients').delete().eq('id',id);if(r.error){toast('DELETE FAILED: '+r.error.message);return}}D.visits=D.visits.filter(v=>v.patientId!==id);D.patients=D.patients.filter(v=>v.id!==id);saveLocal();patient=null;toast('PATIENT DELETED');go('patients')}
function printVisitById(id){const v=D.visits.find(x=>x.id===id),p=D.patients.find(x=>x.id===v?.patientId);if(v&&p)showPrintPreview(v,p)}
function prescriptionHTML(v,p){const meds=v.medicines||[];return `<div class="print-preview"><div class="print-head"><div><b>PRIME HOSPITAL</b><div>QUALITY TREATMENT</div></div><div>NAME: <b>${esc(p.firstName)}</b><br>DATE: <b>${esc(v.date)}</b></div></div><div class="print-line"><b>UHID:</b> ${esc(p.uhid)} &nbsp; <b>AGE:</b> ${esc(p.age)} &nbsp; <b>SEX:</b> ${esc(p.sex)} &nbsp; <b>MOBILE:</b> ${esc(p.mobile)}</div><div class="print-vitals"><span>BP: ${esc(v.bp||'—')}</span><span>PULSE: ${esc(v.pulse||'—')}</span><span>SPO2: ${esc(v.spo2||'—')}</span><span>RR: ${esc(v.rr||'—')}</span><span>TEMP: ${esc(v.temp||'—')}</span><span>WT: ${esc(v.weight||'—')}</span><span>SUGAR: ${esc(v.sugar||'—')}</span></div><div class="print-line"><b>COMPLAINTS:</b> <span class="print-clinical">${esc(v.complaints||'—')}</span></div><div class="print-line"><b>KNOWN CASE OF / HABITS:</b> <span class="print-clinical">${esc(v.knownCase||'—')}</span></div><div class="print-line"><b>HISTORY:</b> <span class="print-clinical">${esc(v.history||'—')}</span></div><div class="print-line"><b>EXAMINATION:</b> <span class="print-clinical">${esc(v.examination||'—')}</span></div><div class="print-line"><b>PD:</b> ${esc(v.pd||'—')} &nbsp; <b>TREATMENT:</b> ${esc(v.treatment||'—')}</div><div class="print-line"><b>INVESTIGATION:</b> ${esc(v.investigation||'—')} &nbsp; <b>ADVICE:</b> ${esc(v.advice||'—')} &nbsp; <b>MANAGEMENT:</b> ${esc(v.management||'—')}</div><table class="print-rx"><thead><tr><th>#</th><th>MEDICINE</th><th>DOSE</th><th>FREQUENCY</th><th>DURATION</th></tr></thead><tbody>${meds.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.dose)}</td><td>${esc(x.frequency)}</td><td>${esc(x.duration)}</td></tr>`).join('')}</tbody></table><div class="print-sign">Dr. Adnan Ahmed Hidayatullah Khan<br>MBBS • CCDM • ACCD<br><br>Signature</div></div>`}
function showPrintPreview(v,p){const old=document.getElementById('printModal');if(old)old.remove();const modal=document.createElement('div');modal.id='printModal';modal.className='modal-backdrop no-print';modal.innerHTML=`<div class="modal"><div class="modal-head"><h3>PRINT PREVIEW</h3><div><button class="btn secondary" onclick="setPrintSize('A5')">A5</button> <button class="btn secondary" onclick="setPrintSize('A4')">A4</button> <button class="btn primary" onclick="window.print()">SAVE & PRINT</button> <button class="btn secondary" onclick="this.closest('.modal-backdrop').remove()">CLOSE</button></div></div><div id="printArea">${prescriptionHTML(v,p)}</div></div>`;document.body.appendChild(modal)}
function setPrintSize(size){const s=document.getElementById('printStyle')||document.head.appendChild(Object.assign(document.createElement('style'),{id:'printStyle'}));s.textContent=`@media print{@page{size:${size} portrait;margin:0.8cm}body>*:not(#printModal){display:none!important}#printModal{display:block!important;position:static!important;background:#fff!important}.modal{width:100%!important;max-height:none!important;padding:0!important}.modal-head{display:none!important}.print-preview{width:100%;padding:0!important;font-size:${size==='A5'?'11px':'12px'}!important}.print-head{margin-top:${size==='A5'?'2.6cm':'1.5cm'}!important}}`}
window.addEventListener('online',()=>{if(session)sync();const p=document.querySelector('.pill');if(p)p.textContent='ONLINE'});window.addEventListener('offline',()=>{const p=document.querySelector('.pill');if(p)p.textContent='OFFLINE';setStatus('OFFLINE')});
db.auth.onAuthStateChange((_e,s)=>{session=s;if(s&&view==='home'&&!$('#main')){loadLocal();render();setTimeout(()=>sync(),0)}});
(async function boot(){loadLocal();const r=await db.auth.getSession();session=r.data.session;if(session){render();await sync()}else loginScreen()})();
</script>
</body></html>
